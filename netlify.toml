[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_DEMO_ONLY = "true"
  VITE_API_URL = ""
  VITE_SUPABASE_URL = ""
  VITE_SUPABASE_PUBLISHABLE_KEY = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
